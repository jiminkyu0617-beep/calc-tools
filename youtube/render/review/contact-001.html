<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../theme.css">
<style>
  html, body { width: 1280px; height: 1500px; }
  .wrap { padding: 40px 40px 24px; }
  h1 { font-size: 40px; font-weight: 900; letter-spacing: -0.03em; }
  .sub { font-size: 22px; color: var(--muted); font-weight: 600; margin-top: 8px; }
  .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 16px; margin-top: 28px; }
  figure { margin: 0; }
  img { width: 100%; display: block; border: 1px solid var(--grid); border-radius: 6px; }
  figcaption { font-size: 19px; font-weight: 700; color: var(--muted); margin-top: 8px; letter-spacing: -0.01em; }
  figcaption b { color: var(--accent); font-weight: 800; }
  .note { font-size: 20px; color: var(--muted); font-weight: 600; margin-top: 26px; line-height: 1.5; }
</style>
<div class="wrap">
  <h1>001 · 가장 깊은 구멍</h1>
  <div class="sub">59.00초 · 1080×1920 · 30fps · 프레임 1770 · 컷 없음(전 구간 연속 모션)</div>
  <div class="grid" id="g"></div>
  <div class="note">각 칸의 시각을 그대로 말씀해 주시면 됩니다 — 예: "0:22 화면이 비어 보인다"</div>
</div>
<script>
  // 씬의 전환 지점을 고른다. 자막이 바뀌는 순간과 그 중간을 섞어 배치했다.
  const TIMES = [0.8, 2.4, 3.6, 6.0, 9.0, 11.4,
                 13.5, 17.5, 22.0, 26.5, 31.0, 35.0,
                 40.0, 43.5, 45.5, 48.0, 52.8, 56.5];
  const pad = n => String(n).padStart(5, '0');
  const tc  = t => `${Math.floor(t/60)}:${String(Math.floor(t%60)).padStart(2,'0')}`;
  document.getElementById('g').innerHTML = TIMES.map(t => {
    const f = Math.round(t * 30);
    return `<figure><img src="../out/001-deepest-hole/frames/${pad(f)}.png">` +
           `<figcaption><b>${tc(t)}</b> · ${t.toFixed(1)}s</figcaption></figure>`;
  }).join('');
</script>
