<!doctype html>
<meta charset="utf-8">
<title>30일 지출 리셋 워크북</title>
<style>
  @font-face { font-family: 'Pretendard'; font-weight: 400; src: url('../../youtube/render/node_modules/pretendard/dist/public/static/Pretendard-Regular.otf'); }
  @font-face { font-family: 'Pretendard'; font-weight: 600; src: url('../../youtube/render/node_modules/pretendard/dist/public/static/Pretendard-SemiBold.otf'); }
  @font-face { font-family: 'Pretendard'; font-weight: 800; src: url('../../youtube/render/node_modules/pretendard/dist/public/static/Pretendard-ExtraBold.otf'); }
  @page { size: A4; margin: 0; }
  :root { --ink:#1F2328; --muted:#6B7580; --line:#D5DAE0; --soft:#F4F6F8; --accent:#E8563A; --paper:#FFFFFF; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Pretendard', sans-serif; color: var(--ink); background: var(--paper); font-feature-settings: 'tnum' 1; }
  .page { width: 210mm; height: 297mm; padding: 18mm 17mm 16mm; position: relative; page-break-after: always; overflow: hidden; }
  .page:last-child { page-break-after: auto; }
  .folio { position: absolute; bottom: 9mm; left: 17mm; right: 17mm; display: flex; justify-content: space-between;
           font-size: 8pt; color: var(--muted); }
  h1 { font-size: 30pt; font-weight: 800; letter-spacing: -0.03em; line-height: 1.15; }
  h2 { font-size: 17pt; font-weight: 800; letter-spacing: -0.02em; margin-bottom: 5mm; }
  h3 { font-size: 11pt; font-weight: 800; margin: 5mm 0 2mm; }
  p, li { font-size: 10pt; line-height: 1.65; }
  .muted { color: var(--muted); }
  .accent { color: var(--accent); }
  .tag { display: inline-block; font-size: 8.5pt; font-weight: 600; color: var(--accent);
         border: 1px solid var(--accent); border-radius: 20px; padding: 1mm 3mm; }
  table { width: 100%; border-collapse: collapse; }
  td, th { border-bottom: 1px solid var(--line); font-size: 9.5pt; padding: 2.6mm 1.5mm; text-align: left; vertical-align: middle; }
  th { font-weight: 600; color: var(--muted); font-size: 8.5pt; border-bottom: 1.5px solid var(--ink); }
  .blank { color: transparent; }
  .box { border: 1.2px solid var(--line); border-radius: 3mm; padding: 4mm 5mm; margin-top: 4mm; }
  .line { border-bottom: 1px solid var(--line); height: 8mm; }

  /* 하루 칸 */
  .day { border: 1.2px solid var(--line); border-radius: 3mm; padding: 2.4mm 4mm 2.8mm; margin-bottom: 3mm; }
  .day th { padding: 1.3mm 1.5mm; }
  .day-head { display: flex; align-items: baseline; gap: 4mm; margin-bottom: 1mm; }
  .day-no { font-size: 15pt; font-weight: 800; letter-spacing: -0.02em; }
  .day-no small { font-size: 9pt; color: var(--muted); font-weight: 600; margin-left: 1mm; }
  .date { font-size: 9pt; color: var(--muted); }
  .nospend { margin-left: auto; font-size: 9pt; color: var(--muted); }
  .nospend i { display: inline-block; width: 4mm; height: 4mm; border: 1.3px solid var(--accent); border-radius: 1mm; vertical-align: -0.6mm; margin-right: 1.2mm; }
  .day table td { padding: 1.2mm 1.5mm; height: 6.4mm; }   /* 손글씨 한 줄 높이 */
  .col-amt { width: 26mm; text-align: right; }
  .col-kind { width: 30mm; font-size: 8.5pt; color: var(--muted); white-space: nowrap; }
  .day-foot { display: flex; gap: 6mm; margin-top: 2mm; font-size: 9pt; color: var(--muted); }
  .day-foot span { flex: 1; border-bottom: 1px solid var(--line); padding-bottom: 1mm; }
  .day-foot .sum { flex: 0 0 42mm; }

  /* 표지 */
  .cover { background: #111418; color: #F2F5F7; display: flex; flex-direction: column; justify-content: space-between; }
  .cover h1 { font-size: 40pt; color: #F2F5F7; }
  .cover .big { font-size: 110pt; font-weight: 800; letter-spacing: -0.05em; color: var(--accent); line-height: 1; }
  .cover p { color: #A9B3BD; font-size: 11pt; }
  .cover .folio { color: #6B7580; }
  .rule { display:flex; gap:4mm; margin-top: 5mm; }
  .rule div { flex:1; background: var(--soft); border-radius: 3mm; padding: 5mm 4mm; }
  .rule b { display:block; font-size: 22pt; font-weight: 800; color: var(--accent); margin-bottom: 1mm; }
  .rule span { font-size: 9.5pt; line-height: 1.55; }
</style>

<div id="book"></div>

<script>
const PAGES = [];
const folio = n => `<div class="folio"><span>30일 지출 리셋 워크북</span><span>${n}</span></div>`;

// 1. 표지
PAGES.push(`<div class="page cover">
  <div><span class="tag" style="color:#E8563A;border-color:#E8563A">하린의 30일 기록</span></div>
  <div>
    <div class="big">30</div>
    <h1>일 지출 리셋<br>워크북</h1>
    <p style="margin-top:6mm">월급날 다음 날부터, 쓴 돈을 전부 적는 30일.<br>하루 5분이면 됩니다.</p>
  </div>
  <p style="font-size:8.5pt">하린은 AI로 만든 가상 인물입니다. 이 워크북은 일반적인 기록 도구이며 재무·세무 자문이 아닙니다.</p>
</div>`);

// 2. 사용법
PAGES.push(`<div class="page">
  <h2>이렇게 씁니다</h2>
  <p>이 워크북은 돈을 아끼라고 말하지 않습니다. <b>어디로 가는지 보게</b> 해줄 뿐입니다.
     30일 동안 적기만 하면, 줄일 곳은 스스로 보입니다.</p>
  <div class="rule">
    <div><b>1</b><span>하루 5분,<br>자기 전에 적는다</span></div>
    <div><b>2</b><span>1원이라도<br>전부 적는다</span></div>
    <div><b>3</b><span>판단하지 말고<br>적기만 한다</span></div>
  </div>
  <h3>하루 칸 적는 법</h3>
  <table>
    <tr><th>칸</th><th>적는 것</th></tr>
    <tr><td>항목</td><td>무엇에 썼는지 (커피, 점심, 택시…)</td></tr>
    <tr><td>금액</td><td>실제로 나간 돈. 카드·현금·간편결제 모두</td></tr>
    <tr><td>필요 / 욕구</td><td>없으면 곤란했으면 <b>필요</b>, 없어도 됐으면 <b>욕구</b>. 고민되면 욕구</td></tr>
    <tr><td>무지출</td><td>그날 한 푼도 안 썼으면 체크 (고정지출 자동이체는 제외)</td></tr>
    <tr><td>한 줄</td><td>그날 지출에 대한 느낌 한 줄. "배달은 피곤해서였다"</td></tr>
  </table>
  <h3>일주일마다</h3>
  <p>7일째 되는 날 <b>주간 점검</b> 칸을 채웁니다. 합계, 가장 큰 지출, 다음 주에 바꿀 <b>딱 한 가지</b>.</p>
  <div class="box"><p class="muted">3일째에 무너져도 괜찮습니다. 하린도 3일째에 배달 앱 때문에 무너졌습니다.
  빈 날이 생기면 기억나는 만큼만 적고 다음 날로 넘어가세요. 30일을 <b>완벽하게</b>가 아니라 <b>끝까지</b>.</p></div>
  ${folio(2)}
</div>`);

// 3. 시작 전
PAGES.push(`<div class="page">
  <h2>시작 전 — 내 한 달</h2>
  <h3>1. 실제로 들어오는 돈</h3>
  <p class="muted">월급에서 4대보험이 빠진 금액을 먼저 확인하세요.
  <span class="accent">계산모음 4대보험 계산기</span> — jiminkyu0617-beep.github.io/calc-tools</p>
  <table><tr><th>세전 월급</th><th>4대보험 공제</th><th>소득세 등</th><th>실수령액</th></tr>
    <tr><td class="blank">.</td><td></td><td></td><td></td></tr></table>
  <h3>2. 매달 자동으로 나가는 돈 (고정지출)</h3>
  <table><tr><th>항목</th><th class="col-amt">금액</th><th>날짜</th><th>줄일 수 있나?</th></tr>
    ${['월세·관리비','통신비','구독 서비스','보험','교통','대출 상환','기타','기타'].map(x=>`<tr><td>${x}</td><td></td><td></td><td class="muted">예 / 아니오</td></tr>`).join('')}
    <tr><td><b>합계</b></td><td></td><td></td><td></td></tr></table>
  <h3>3. 이번 30일의 목표 — 딱 하나</h3>
  <div class="line"></div>
  <p class="muted" style="margin-top:2mm;font-size:8.5pt">예: "배달 주 2회 이하" · "무지출 10일" · "구독 2개 해지"</p>
  <h3>4. 시작하는 날</h3>
  <table><tr><th>시작일</th><th>통장 잔액</th><th>카드 사용 예정액</th></tr><tr><td class="blank">.</td><td></td><td></td></tr></table>
  ${folio(3)}
</div>`);

// 하루 칸
const dayBlock = n => `<div class="day">
  <div class="day-head"><span class="day-no">Day ${n}<small>/ 30</small></span><span class="date">____월 ____일 (____)</span>
    <span class="nospend"><i></i>무지출</span></div>
  <table>
    <tr><th>항목</th><th class="col-amt">금액</th><th class="col-kind">필요 / 욕구</th></tr>
    ${'<tr><td></td><td></td><td class="col-kind">○ 필요 ○ 욕구</td></tr>'.repeat(4)}
  </table>
  <div class="day-foot"><span class="sum">오늘 합계</span><span>한 줄</span></div>
</div>`;

const weekReview = w => `<div class="box" style="margin-top:2mm">
  <h3 style="margin-top:0">${w}주차 점검</h3>
  <table>
    <tr><th>이번 주 합계</th><th>무지출 일수</th><th>욕구 지출 합계</th></tr>
    <tr><td class="blank">.</td><td></td><td></td></tr>
  </table>
  <p style="margin-top:3mm;font-size:9pt" class="muted">가장 컸던 지출과 이유</p><div class="line"></div>
  <p style="margin-top:3mm;font-size:9pt" class="muted">다음 주에 바꿀 딱 한 가지</p><div class="line"></div>
</div>`;

let pageNo = 4;
for (let w = 1; w <= 4; w++) {
  const s = (w - 1) * 7 + 1;
  PAGES.push(`<div class="page"><h2>${w}주차</h2>${[s, s+1, s+2, s+3].map(dayBlock).join('')}${folio(pageNo++)}</div>`);
  PAGES.push(`<div class="page">${[s+4, s+5, s+6].map(dayBlock).join('')}${weekReview(w)}${folio(pageNo++)}</div>`);
}
PAGES.push(`<div class="page"><h2>마지막 이틀</h2>${[29, 30].map(dayBlock).join('')}
  <div class="box"><p>여기까지 왔다면 이미 대부분의 사람보다 멀리 왔습니다. 다음 장에서 30일을 돌아봅니다.</p></div>
  ${folio(pageNo++)}</div>`);

// 결산
PAGES.push(`<div class="page">
  <h2>30일 결산</h2>
  <table>
    <tr><th></th><th>1주차</th><th>4주차</th><th>달라진 것</th></tr>
    <tr><td>주간 합계</td><td></td><td></td><td></td></tr>
    <tr><td>무지출 일수</td><td></td><td></td><td></td></tr>
    <tr><td>욕구 지출</td><td></td><td></td><td></td></tr>
  </table>
  <h3>30일 동안 가장 많이 나간 항목 TOP 3</h3>
  <table><tr><th>순위</th><th>항목</th><th class="col-amt">합계</th><th>필요였나?</th></tr>
    ${[1,2,3].map(n=>`<tr><td>${n}</td><td></td><td></td><td class="muted">필요 / 욕구</td></tr>`).join('')}</table>
  <h3>처음 세운 목표는?</h3>
  <p class="muted">○ 해냈다 &nbsp;&nbsp; ○ 절반쯤 &nbsp;&nbsp; ○ 못 했지만 이유를 안다</p>
  <h3>다음 30일에 가져갈 한 가지</h3>
  <div class="line"></div><div class="line"></div>
  ${folio(pageNo++)}
</div>`);

// 마무리
PAGES.push(`<div class="page" style="display:flex;flex-direction:column;justify-content:center">
  <h1 style="font-size:26pt">30일,<br>끝까지 적었습니다.</h1>
  <p style="margin-top:6mm">숫자가 줄었든 그대로든, 이제 내 돈이 어디로 가는지 압니다.<br>그게 이 워크북이 약속한 전부입니다.</p>
  <div class="box" style="margin-top:12mm">
    <p style="font-size:8.5pt" class="muted">
    · 하린은 AI로 만든 가상 인물입니다. 하린의 기록은 이 워크북의 사용 예시로 연출된 것입니다.<br>
    · 이 워크북은 일반적인 기록 도구이며, 개인의 재무·세무·투자 판단에 대한 자문이 아닙니다.<br>
    · 급여·세금 금액은 관할 기관 또는 전문가에게 확인하세요.<br>
    · 계산모음: jiminkyu0617-beep.github.io/calc-tools
    </p>
  </div>
  ${folio(pageNo++)}
</div>`);

document.getElementById('book').innerHTML = PAGES.join('');
</script>
