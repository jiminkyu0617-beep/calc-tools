<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../../theme.css">
<style>
  .num-wrap { position:absolute; left:0; right:0; text-align:center; }
  .ruler { position:absolute; left:120px; top:300px; width:6px; background:var(--grid); }
  .ruler-fill { position:absolute; left:0; top:0; width:6px; background:var(--accent-dim); }
  .ruler-head { position:absolute; left:-13px; width:32px; height:32px; border-radius:50%;
                background:var(--accent); }
  .tick-row { position:absolute; left:150px; color:var(--muted); font-size:var(--fs-label);
              font-weight:600; white-space:nowrap; }
  .head-label { position:absolute; left:150px; font-size:var(--fs-label); font-weight:800;
                color:var(--accent); white-space:nowrap; }
  .bar { position:absolute; height:56px; border-radius:5px; }
  .bar-label { position:absolute; font-size:38px; font-weight:800; white-space:nowrap; }
  .big { position:absolute; left:0; right:0; text-align:center; }
  /* 지름 23cm 원 — 숫자만으로는 '작다'가 안 느껴진다. 형태를 같이 보여준다. */
  .circle { position:absolute; left:50%; border:5px solid var(--text); border-radius:50%; }
  .circle-tick { position:absolute; left:50%; height:2px; background:var(--muted); }
  /* 구멍 단면 — "엿처럼 늘어나 메워진다"를 형태로 보여준다.
     CSS로 암석의 소성 거동 자체는 못 그리지만, 벽이 안으로 흘러드는 결과는 그릴 수 있다 */
  #section { position:absolute; left:0; top:0; width:1080px; height:1920px; }
  .sec-label { position:absolute; left:240px; top:470px; font-size:var(--fs-label);
               font-weight:700; color:var(--muted); white-space:nowrap; }
  .sec-label b { color:var(--accent); font-weight:800; }
  .rest-label { position:absolute; left:150px; font-size:var(--fs-label); font-weight:700;
                color:var(--text); white-space:nowrap; }
  .ruler-hot { position:absolute; left:0; top:0; width:6px; background:var(--accent); }
</style>

<div class="stage">
  <div class="ruler" id="ruler"><div class="ruler-fill" id="rfill"></div><div class="ruler-hot" id="rhot"></div><div class="ruler-head" id="rhead"></div></div>
  <div class="rest-label" id="restLabel">뚫지 못한 3분의 2</div>

  <svg id="section" viewBox="0 0 1080 1920">
    <path id="wallL" fill="#1A2029" stroke="var(--accent-dim)" stroke-width="5"/>
    <path id="wallR" fill="#1A2029" stroke="var(--accent-dim)" stroke-width="5"/>
  </svg>
  <div class="sec-label" id="secLabel">지하 약 12km 단면 · <b>180°C</b></div>
  <div id="ticks"></div>
  <div class="head-label" id="headLabel">12,262 m</div>

  <div class="num-wrap" id="numWrap"><span class="number" id="num">0</span><span class="number unit" id="unit">m</span></div>

  <div id="temp">
    <div class="bar" id="barExp" style="background:var(--grid)"></div>
    <div class="bar-label" id="labExp" style="color:var(--muted)">예상 100°C</div>
    <div class="bar" id="barAct" style="background:var(--accent)"></div>
    <div class="bar-label" id="labAct" style="color:var(--accent)">실제 180°C</div>
  </div>

  <div id="twistGroup">
    <div class="circle" id="circle"></div>
    <div class="circle-tick" id="ctick"></div>
    <div class="big" id="twist"><span class="number" id="twistNum">23</span><span class="number unit">cm</span></div>
  </div>

  <div class="caption" id="cap"></div>
  <div class="badge">SG-3 · 1970–1992</div>
</div>

<script type="module">
import { defineScene, seq, ease, lerp, counter, $ } from '../../lib/scene.js';

const num=$('#num'), unit=$('#unit'), numWrap=$('#numWrap'), cap=$('#cap');
const ruler=$('#ruler'), rfill=$('#rfill'), rhead=$('#rhead'), ticks=$('#ticks'), headLabel=$('#headLabel');
const temp=$('#temp'), barExp=$('#barExp'), barAct=$('#barAct'), labExp=$('#labExp'), labAct=$('#labAct');
const twistGroup=$('#twistGroup'), twist=$('#twist'), twistNum=$('#twistNum'), circle=$('#circle'), ctick=$('#ctick');
const rhot=$('#rhot'), restLabel=$('#restLabel');
const section=$('#section'), wallL=$('#wallL'), wallR=$('#wallR'), secLabel=$('#secLabel');

// 색 보간 — 축 전환 때 눈금자 바탕을 밝힌다
const hex = h => [1,3,5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, p) => { const A = hex(a), B = hex(b);
  return '#' + A.map((v, i) => Math.round(lerp(v, B[i], p)).toString(16).padStart(2, '0')).join(''); };

// 단면: 가운데 틈이 구멍이다. bulge만큼 벽의 가운데가 안으로 흘러든다.
const SEC = { top: 560, bot: 1290, cx: 540, gap: 200, outer: 300 };
function wallPath(side, bulge) {
  const { top, bot, cx, gap, outer } = SEC, mid = (top + bot) / 2;
  const edge = cx + side * gap / 2;            // 원래 벽면
  const out  = cx + side * (gap / 2 + outer);  // 바깥쪽 끝
  const pull = edge - side * bulge;            // 가운데가 안으로 들어온 위치
  // 위·아래는 원래 벽면에 고정되고, 가운데만 흘러든다 — 열을 가장 많이 받는 깊은 곳
  return `M ${out} ${top} L ${edge} ${top} C ${edge} ${mid - 120}, ${pull} ${mid - 160}, ${pull} ${mid} ` +
         `C ${pull} ${mid + 160}, ${edge} ${mid + 120}, ${edge} ${bot} L ${out} ${bot} Z`;
}

const RULER_TOP = 300, RULER_LEN = 1000, DEPTH = 12262;

// 깊이 눈금 (본 구간) / 지각 눈금 (마지막 구간) 두 벌을 따로 둔다.
// 같은 축에 헤드만 옮기면 "4,000m밖에 못 팠다"로 읽힌다 — 사실과 다른 화면이 된다.
const DEPTH_TICKS = [0, 3000, 6000, 9000, 12262].map(d => ({ p: d / DEPTH, text: d.toLocaleString('ko-KR') + ' m' }));
const CRUST_TICKS = [{ p: 0, text: '지표' }, { p: 1, text: '지각 바닥' }];

function buildTicks(list, cls) {
  return list.map(t => {
    const el = document.createElement('div');
    el.className = 'tick-row ' + cls;
    el.textContent = t.text;
    el.style.top = (RULER_TOP + RULER_LEN * t.p - 20) + 'px';
    ticks.appendChild(el);
    return el;
  });
}
const depthEls = buildTicks(DEPTH_TICKS, 'depth');
const crustEls = buildTicks(CRUST_TICKS, 'crust');

const CAPTIONS = [
  [0.6,  4.0, '여기서 <b class="hl">멈췄습니다</b>'],
  [4.4,  8.2, '인간이 판 가장 깊은 구멍'],
  [8.4, 12.0, '19년을 파고 <b class="hl">12,262미터</b>'],
  [12.4,16.0, '멈춘 이유는\n장비만이 아니었습니다'],
  [16.2,20.0, '바닥 온도가 <b class="hl">180도</b>였습니다'],
  [20.2,24.0, '예상은 100도였습니다'],
  [24.2,29.0, '이 온도에서 암석은\n돌처럼 굴지 않습니다'],
  [29.2,33.0, '<b class="hl">엿처럼 늘어납니다</b>'],
  [33.2,37.5, '뚫은 자리가 다시 메워집니다'],
  [38.2,42.0, '그런데 이 구멍의 지름은'],
  [42.2,46.0, '겨우 <b class="hl">23센티미터</b>였습니다'],
  [46.2,50.0, '깊이가 지름의 <b class="hl">5만 배</b>가 넘습니다'],
  [50.4,54.6, '그리고 여기는\n지각의 <b class="hl">3분의 1</b> 지점입니다'],
  [54.8,59.0, '지구는 아직\n한 번도 뚫린 적이 없습니다'],
];

// 나레이션 — 자막과 1:1 대응. 자막은 요점, 나레이션은 읽는 말이다.
// 숫자를 소리 나는 대로 적는다. TTS가 "12,262"를 제멋대로 읽게 두지 않는다.
const NARRATION = [
  '여기서 멈췄습니다.',
  '인간이 판, 가장 깊은 구멍.',
  // '만 이천이백육십이'는 이 목소리가 끝의 '이'를 미터에 삼켜 12,260으로 들린다(인식 검증).
  // 정확한 숫자는 화면에 영상 내내 떠 있다. 나레이션은 발음이 확실하고 참인 말로 한다.
  '십구 년 만에, 십이 킬로미터가 넘는 깊이.',
  '멈춘 이유는 장비만이 아니었습니다.',
  '바닥 온도가 백팔십 도였습니다.',
  '예상은 백 도였습니다.',
  '이 온도에서 암석은 돌처럼 굴지 않습니다.',
  '엿처럼 늘어납니다.',
  '뚫은 자리가 다시 메워집니다.',
  '그런데 이 구멍의 지름은,',
  '겨우 이십삼 센티미터였습니다.',
  '깊이가 지름의 오만 배가 넘습니다.',
  '그리고 여기는 지각의 삼분의 일 지점입니다.',
  '지구는 아직 뚫린 적이 없습니다.',
];

function setCaption(t) {
  const c = CAPTIONS.find(([a, b]) => t >= a && t < b);
  if (!c) { cap.style.opacity = 0; return; }
  const [a, b, text] = c;
  if (cap.dataset.text !== text) { cap.innerHTML = text; cap.dataset.text = text; }
  cap.style.opacity = Math.min(ease.out(seq(t, a, a + 0.25)), 1 - seq(t, b - 0.2, b));
  cap.style.transform = `translateY(${lerp(24, 0, ease.out(seq(t, a, a + 0.35)))}px)`;
}

defineScene({
  duration: 59,
  fps: 30,
  captions: CAPTIONS,
  narration: NARRATION,
  // 효과음은 세 번뿐이다. 룩북 규칙: 의미 있는 순간에만.
  sfx: [[3.40, 'lock'], [42.40, 'open'], [50.40, 'shift']],
  render(t) {
    // ── S1 (0–4) 후킹: 결과 숫자가 먼저 나온다
    num.textContent = counter(t, 0, DEPTH, 0.3, 3.4);
    const lift = ease.inOut(seq(t, 4.0, 5.2));
    numWrap.style.top = lerp(820, 150, lift) + 'px';
    numWrap.style.transform = `scale(${lerp(1, 0.62, lift)})`;
    numWrap.style.opacity = ease.out(seq(t, 0.2, 0.6));
    unit.style.opacity = seq(t, 0.3, 0.5);

    // ── S2 (4.4–12) 눈금자가 내려간다
    const dig = ease.inOut(seq(t, 4.8, 11.5));
    const rulerIn = ease.out(seq(t, 4.4, 5.4));
    const hideRuler = ease.out(seq(t, 29.0, 29.8));   // 단면·반전 구간 동안 비운다
    const backRuler = ease.out(seq(t, 50.0, 51.0));   // 지각 구간에서 되돌아온다
    const crust = ease.inOut(seq(t, 50.4, 52.4));     // 축이 깊이 → 지각으로 바뀐다

    const headP = lerp(dig, 1 / 3, crust);
    ruler.style.height = RULER_LEN + 'px';
    ruler.style.opacity = Math.max(rulerIn - hideRuler, backRuler);
    rfill.style.height = RULER_LEN * headP + 'px';
    rhead.style.top = (RULER_LEN * headP - 16) + 'px';

    // 온도 구간에서는 눈금자를 좌측으로 물리고 흐린다
    const shift = ease.inOut(seq(t, 13.0, 14.2));
    ruler.style.transform = `translateX(${lerp(0, -40, shift)}px)`;
    ticks.style.transform = `translateX(${lerp(0, -40, shift)}px)`;

    const tickBase = Math.max(rulerIn * lerp(1, 0.4, shift) - hideRuler, backRuler);
    depthEls.forEach((el, i) => {
      const reached = dig >= DEPTH_TICKS[i].p - 0.02;
      el.style.opacity = tickBase * (reached ? 1 : 0.18) * (1 - crust);
      el.style.color = (reached && i === depthEls.length - 1) ? 'var(--accent)' : 'var(--muted)';
    });
    crustEls.forEach(el => { el.style.opacity = crust * 0.9; });
    // 헤드 라벨은 축이 지각으로 바뀔 때만 — 헤드가 무슨 깊이인지 못 읽히면 화면이 거짓말을 한다
    headLabel.style.opacity = crust;
    headLabel.style.top = (RULER_TOP + RULER_LEN * headP - 20) + 'px';
    headLabel.style.transform = ruler.style.transform;

    // ── S3 (15–24) 온도: 실제를 먼저, 예상을 나중에 보여 대비를 만든다
    temp.style.opacity = Math.min(ease.out(seq(t, 15.2, 16.0)), 1 - ease.out(seq(t, 29.0, 29.8)));
    const MAXW = 620, X = 340;
    const pAct = ease.out(seq(t, 16.2, 18.0));
    const pExp = ease.out(seq(t, 20.4, 21.6));
    barAct.style.cssText += `;left:${X}px;top:770px;width:${MAXW * pAct}px`;
    labAct.style.cssText += `;left:${X}px;top:712px`;
    labAct.style.opacity = pAct;
    barExp.style.cssText += `;left:${X}px;top:950px;width:${MAXW * (100 / 180) * pExp}px`;
    labExp.style.cssText += `;left:${X}px;top:892px`;
    labExp.style.opacity = pExp;

    // ── S5 (39–50) 반전: 지름 23cm. 원을 같이 그려 '작다'를 형태로 보여준다
    const twIn = ease.out(seq(t, 39.6, 40.6));
    const twOut = ease.out(seq(t, 49.4, 50.2));
    twistGroup.style.opacity = Math.min(twIn, 1 - twOut);
    // 카운트업 전에 0을 보여주면 "지름 0cm"라는 틀린 정보가 된다. 답이 나오기 전은 ?다.
    const asked = t < 42.2;
    twistNum.textContent = asked ? '?' : counter(t, 0, 23, 42.2, 43.4);
    twistNum.style.color = asked ? 'var(--muted)' : '';
    twist.style.top = '1180px';
    const D = lerp(0, 300, ease.out(seq(t, 42.4, 44.0)));   // 원이 열린다
    circle.style.cssText += `;width:${D}px;height:${D}px;top:${820 + (300 - D) / 2}px;margin-left:${-D / 2}px`;
    circle.style.opacity = D < 4 ? 0 : 1;   // 지름 0일 때 테두리가 점으로 남는다
    ctick.style.cssText += `;width:${D}px;top:${820 + 150}px;margin-left:${-D / 2}px`;
    ctick.style.opacity = seq(t, 43.4, 44.2) * 0.5;

    // ── S4 (29–38) 단면: 벽이 안으로 흘러 구멍이 메워진다
    const secIn = ease.out(seq(t, 29.2, 30.0));
    const secOut = ease.out(seq(t, 37.0, 37.8));
    const secO = Math.min(secIn, 1 - secOut);
    section.style.opacity = secO;
    secLabel.style.opacity = secO;
    const bulge = lerp(0, 58, ease.inOut(seq(t, 29.8, 33.0)))       // 엿처럼 늘어난다
                + lerp(0, 38, ease.inOut(seq(t, 33.4, 36.8)));      // 다시 메워진다 (틈 ≈ 8px)
    wallL.setAttribute('d', wallPath(-1, bulge));
    wallR.setAttribute('d', wallPath(+1, bulge));

    // ── ③ 지각 구간: 뚫은 1/3은 강조, 뚫지 못한 2/3을 말로 짚는다
    ruler.style.background = mix('#232B35', '#465363', crust);
    rhot.style.height = RULER_LEN * headP + 'px';
    rhot.style.opacity = crust;
    crustEls.forEach(el => { el.style.opacity = crust; });
    restLabel.style.opacity = ease.out(seq(t, 52.6, 53.6));
    restLabel.style.top = (RULER_TOP + RULER_LEN * (2 / 3) - 20) + 'px';
    restLabel.style.transform = ruler.style.transform;

    setCaption(t);
  },
});
</script>
