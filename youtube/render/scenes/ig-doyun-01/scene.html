<!doctype html>
<meta charset="utf-8">
<link rel="stylesheet" href="../../theme.css">
<!--
  도윤 릴스 1편 — "D-30 · 5분만" (influencer/content/doyun-reels.md 1번)
  구조는 하린 1편(ig-harin-01)과 같다: 사진 2컷 + 카메라 무브 + 첫 프레임 카드 + 말 자막.
  도윤 계정 규칙: 첫 1초에 날짜와 남은 시간. 효과는 말하지 않는다.
    tie.jpg  = 퇴근 직후 넥타이를 푸는 컷 (기준 얼굴에서 편집 생성)
    look.jpg = 기준 이미지 seed 1029 (운동복으로 갈아입고 매트 앞에 선 컷)
  컷 2부터 5분 타이머가 줄어든다 — "지금 시작했다"를 숫자로 보여준다.
-->
<style>
  :root { --paper:#F3F6F1; --ink:#1F2A22; --pen:#3F9A4A; }
  .shot { position:absolute; left:0; top:0; width:1080px; height:1920px; overflow:hidden; }
  .shot img { position:absolute; top:0; height:1920px; will-change:transform; }
  .shade { position:absolute; left:0; right:0; bottom:0; height:900px;
           background:linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,.55)); }
  .shade-top { position:absolute; left:0; right:0; top:0; height:700px;
               background:linear-gradient(to top, rgba(0,0,0,0), rgba(0,0,0,.35)); }
  #card { position:absolute; left:72px; top:250px; padding:34px 44px 38px; background:var(--paper);
          border-radius:28px; color:var(--ink); transform-origin:0 0; }
  #card .d { font-size:150px; font-weight:900; line-height:1; letter-spacing:-4px; color:var(--pen); }
  #card .spent { margin-top:14px; font-size:60px; font-weight:800; letter-spacing:-1px; white-space:nowrap; }
  #card .timer { margin-top:18px; display:inline-block; padding:8px 22px; border-radius:999px;
                 background:var(--ink); color:#fff; font-size:48px; font-weight:800; }
  #ai { position:absolute; left:72px; top:150px; padding:10px 20px; border-radius:999px;
        background:rgba(0,0,0,.45); color:#fff; font-size:28px; font-weight:600; }
  #sub { position:absolute; left:72px; width:830px; top:1290px; text-align:center;
         font-size:58px; font-weight:800; line-height:1.3; color:#fff; letter-spacing:-1px;
         text-shadow:0 2px 14px rgba(0,0,0,.6); white-space:pre-line; }
  #sub b { color:#BFF0C3; }
</style>

<div class="stage">
  <div class="shot" id="s1"><img id="i1" src="tie.jpg"></div>
  <div class="shot" id="s2"><img id="i2" src="look.jpg"></div>
  <div class="shade-top"></div>
  <div class="shade"></div>
  <div id="ai">AI로 만든 가상 인물</div>
  <div id="card">
    <div class="d">D-30</div>
    <div class="spent">오늘도 5분만</div>
    <div class="timer" id="timer">05:00</div>
  </div>
  <div id="sub"></div>
</div>

<script type="module">
import { defineScene, seq, ease, lerp, $ } from '../../lib/scene.js';

const CAPTIONS = [
  [0.3, 3.1, '오늘도 퇴근이 늦었습니다'],
  [3.3, 6.6, '그래도 <b>딱 5분</b>만\n하기로 했습니다'],
  [7.0, 9.8, '퇴근하고 제일 먼저\n뭐 해요?'],
];
const NARRATION = [
  '오늘도 퇴근이 늦었습니다.',
  '그래도 딱 오 분만 하기로 했습니다.',
  '퇴근하고 제일 먼저 뭐 해요?',
];

const CUT = 6.7;      // 두 번째 말이 끝나면 운동복 컷 — 타이머가 이때부터 줄어든다
const DUR = 11;

const i1 = $('#i1'), i2 = $('#i2'), s2 = $('#s2'), card = $('#card'), sub = $('#sub'), timer = $('#timer');

function place(img, left, scale, ox, oy) {
  img.style.left = -left + 'px';
  img.style.transformOrigin = `${ox}px ${oy}px`;
  img.style.transform = `scale(${scale})`;
}

function setSub(t) {
  const c = CAPTIONS.find(([a, b]) => t >= a && t < b);
  if (!c) { sub.style.opacity = 0; return; }
  const [a, b, text] = c;
  if (sub.dataset.text !== text) { sub.innerHTML = text; sub.dataset.text = text; }
  sub.style.opacity = Math.min(ease.out(seq(t, a, a + 0.2)), 1 - seq(t, b - 0.15, b));
  sub.style.transform = `translateY(${lerp(18, 0, ease.out(seq(t, a, a + 0.3)))}px)`;
}

defineScene({
  duration: DUR,
  fps: 30,
  captions: CAPTIONS,
  narration: NARRATION,
  render(t) {
    // 컷 1: 넥타이 쥔 손 쪽으로 천천히 밀고 들어간다
    place(i1, 120, lerp(1.0, 1.08, ease.inOut(seq(t, 0, CUT))), 700, 950);   // 얼굴을 오른쪽으로 — 카드에 뺨이 가렸다(미리보기 0초)
    // 컷 2: 운동복으로 선 모습. 살짝 물러나며 시작
    place(i2, 210, lerp(1.07, 1.0, ease.out(seq(t, CUT, DUR))), 750, 700);
    s2.style.opacity = t >= CUT ? 1 : 0;

    // 타이머: 컷 1에서는 05:00에 멈춰 있고, 컷 2부터 실제 시간으로 줄어든다
    const left = Math.max(0, 300 - Math.max(0, t - CUT));
    const s = Math.ceil(left);
    timer.textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;

    const pc = ease.out(seq(t, 0, 0.35));
    const shrink = ease.out(seq(t, CUT, CUT + 0.35));
    card.style.transform = `translateY(${lerp(-10, 0, pc)}px) scale(${lerp(1.03, 1, pc) * lerp(1, 0.72, shrink)})`;

    setSub(t);
  },
});
</script>
